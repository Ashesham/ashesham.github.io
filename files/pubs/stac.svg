      <rect x="60" y="126" width="22" height="22" rx="4" opacity="0.32"/><rect x="90" y="126" width="22" height="22" rx="4" opacity="0.58"/><rect x="120" y="126" width="22" height="22" rx="4" opacity="0.24"/><rect x="150" y="126" width="22" height="22" rx="4" opacity="0.42"/><rect x="180" y="126" width="22" height="22" rx="4" opacity="0.20"/><rect x="210" y="126" width="22" height="22" rx="4" opacity="0.52"/>
      <rect x="60" y="156" width="22" height="22" rx="4" opacity="0.44"/><rect x="90" y="156" width="22" height="22" rx="4" opacity="0.26"/><rect x="120" y="156" width="22" height="22" rx="4" opacity="0.50"/><rect x="150" y="156" width="22" height="22" rx="4" opacity="0.34"/><rect x="180" y="156" width="22" height="22" rx="4" opacity="0.56"/><rect x="210" y="156" width="22" height="22" rx="4" opacity="0.22"/>
